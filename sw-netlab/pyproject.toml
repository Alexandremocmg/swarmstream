[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# benchmark.py constructs URLs from the ephemeral localhost server created in that process.
"benchmark.py" = ["S310"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["server.py", "benchmark.py"]
