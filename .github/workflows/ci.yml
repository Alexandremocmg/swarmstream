name: ci

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build+test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure (vcpkg toolchain)
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-*) VCPKG_FILE='C:/vcpkg/scripts/buildsystems/vcpkg.cmake' ;;
            *)         VCPKG_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" ;;
          esac
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_FILE"

      - name: Build
        run: cmake --build build --config Debug --parallel

      # F1-12: um tmpfs de 16 MiB para o teste do DiskFull que vem do próprio SO (sem encher o
      # disco do runner). O teste fica PULADO onde SW_TEST_SMALL_FS não existe.
      - name: Mount small tmpfs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /mnt/sw-small
          sudo mount -t tmpfs -o size=16m,mode=1777 tmpfs /mnt/sw-small
          echo "SW_TEST_SMALL_FS=/mnt/sw-small" >> "$GITHUB_ENV"
          echo "SW_REQUIRE_SMALL_FS=1" >> "$GITHUB_ENV"

      # Prova no log que o teste do DiskFull nativo rodou (o ctest só mostra a saída de quem falha).
      - name: DiskFull nativo no tmpfs (Linux)
        if: runner.os == 'Linux'
        run: |
          out="$(build/sw-core/sw-core-store-tests)"
          echo "$out" | grep -A3 'DiskFull do próprio SO'
          if echo "$out" | grep -q 'PULADO: SW_TEST_SMALL_FS'; then exit 1; fi

      - name: Test
        shell: bash
        run: ctest --test-dir build --build-config Debug --output-on-failure --timeout 120

  # F1-46: build com NDEBUG. O `assert` some nesse build; os testes usam SW_CHECK (tests/check.hpp),
  # então este job pega teste que só passaria "por não verificar nada".
  release-tests:
    name: release tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Release, vcpkg toolchain)
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-*) VCPKG_FILE='C:/vcpkg/scripts/buildsystems/vcpkg.cmake' ;;
            *)         VCPKG_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" ;;
          esac
          cmake -S . -B build             -DCMAKE_BUILD_TYPE=Release             -DBUILD_TESTING=ON             -DCMAKE_TOOLCHAIN_FILE="$VCPKG_FILE"

      - name: Confirma que Release define NDEBUG
        shell: bash
        run: grep -E 'CMAKE_CXX_FLAGS_RELEASE:STRING=.*NDEBUG' build/CMakeCache.txt

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: bash
        run: ctest --test-dir build --build-config Release --output-on-failure --timeout 120

  sanitizers:
    name: ASan+UBSan (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Configure (ASan + UBSan)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DSANITIZE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test under sanitizers
        run: ctest --test-dir build --output-on-failure --timeout 120

  # F1-12: critério de aceite "sem data race no TSan com 16 threads leitoras"
  # (sw-core-owner). Roda todos os testes com -fsanitize=thread; halt_on_error derruba o teste
  # na primeira corrida reportada.
  tsan:
    name: TSan (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4

      # O kernel dos runners usa 32 bits de aleatoriedade no mmap, que o TSan não aceita
      # ("unexpected memory mapping"). 28 é o valor que o TSan suporta.
      - name: Ajusta o ASLR para o TSan
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure (TSan)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DSANITIZE_THREAD=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test under TSan
        run: ctest --test-dir build --output-on-failure --timeout 300
