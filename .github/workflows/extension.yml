#
# F1-49: compila a GDExtension (loader e registro, com godot-cpp na tag fixada) em Ubuntu e
# Windows (MSVC) e roda o portão do F1-20 sem janela no Ubuntu, no mesmo job (sem artefatos:
# a cota de armazenamento de artefatos da conta está esgotada). O godot-cpp e o Godot não entram
# no git: o godot-cpp vem do tag fixado (com cache) e o Godot é baixado com o SHA-512 conferido.

name: extension

# F1-55: só roda quando mudar a extensão, o núcleo ou este workflow. No PR, só Ubuntu (com o
# portão); o Windows roda no push da main e uma vez por semana (schedule, que ignora `paths`).
on:
  pull_request:
    paths:
      - "sw-godot/**"
      - "sw-core/**"
      - "sw-format/**"
      - "vcpkg.json"
      - ".github/workflows/extension.yml"
  push:
    branches: [main]
    paths:
      - "sw-godot/**"
      - "sw-core/**"
      - "sw-format/**"
      - "vcpkg.json"
      - ".github/workflows/extension.yml"
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_CPP_TAG: godot-4.5-stable
  GODOT_VERSION: 4.7.2-stable
  # SHA-512 oficial do Godot_v4.7.2-stable_linux.x86_64.zip (SHA512-SUMS.txt da release 4.7.2-stable)
  GODOT_LINUX_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65

jobs:
  build:
    name: GDExtension build (${{ matrix.os }}; portão no Ubuntu)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch godot-cpp (tag fixo, fora do git)
        shell: bash
        run: |
          git clone --depth 1 --branch "$GODOT_CPP_TAG" https://github.com/godotengine/godot-cpp.git "$RUNNER_TEMP/godot-cpp"

      # F1-17: o sw-core passou a ligar o sw-format (ManifestView do VFS), que precisa do libsodium
      # (ADR-0012). A extensão configura o sw-core sozinha, sem o toolchain do vcpkg, então este
      # job tem de prover o libsodium como os outros jobs: pacote do sistema + pkg-config no Linux
      # (como o job de sanitizers) e o vcpkg do runner no Windows (como o build+test do ci.yml).
      - name: Instala libsodium (Linux, sem vcpkg)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev pkg-config

      # O clone do vcpkg do runner pode não ter o commit do builtin-baseline do vcpkg.json (F1-04).
      - name: Busca o baseline do vcpkg no clone do runner (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git -C 'C:/vcpkg' fetch --depth=1 origin e456309491fd875487bf02b8a0dca76c1b1b00cc || git -C 'C:/vcpkg' fetch origin e456309491fd875487bf02b8a0dca76c1b1b00cc

      # A chave mudou (v2) para não restaurar um build-godot configurado antes do libsodium/toolchain.
      - name: Cache do build da extensão (godot-cpp incluído)
        uses: actions/cache@v4
        with:
          path: build-godot
          key: godot-build-v2-${{ matrix.os }}-${{ env.GODOT_CPP_TAG }}-${{ hashFiles('sw-godot/extension/**', 'sw-core/**', 'sw-format/**', 'vcpkg.json') }}
          restore-keys: |
            godot-build-v2-${{ matrix.os }}-${{ env.GODOT_CPP_TAG }}-

      - name: Configurar (CMake)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            GODOT_CPP_DIR="$(cygpath -m "$RUNNER_TEMP/godot-cpp")"
            # A fonte é sw-godot/extension; o vcpkg.json fica na raiz do repositório.
            EXTRA_ARGS=(-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
                        -DVCPKG_MANIFEST_DIR="$(cygpath -m "$GITHUB_WORKSPACE")")
          else
            GODOT_CPP_DIR="$RUNNER_TEMP/godot-cpp"
            # Mapa do ligador (só escreve um arquivo; o .so não muda): o passo "Membros de
            # biblioteca incorporados e dependências do .so" lê dele quais membros de arquivo (.a)
            # o ligador incorporou ao .so.
            EXTRA_ARGS=(-DCMAKE_SHARED_LINKER_FLAGS="-Wl,-Map=$GITHUB_WORKSPACE/build-godot/swarmstream_godot.map")
          fi
          cmake -S sw-godot/extension -B build-godot \
            -DCMAKE_BUILD_TYPE=Release \
            -DGODOT_CPP_DIR="$GODOT_CPP_DIR" \
            "${EXTRA_ARGS[@]}"

      - name: Compilar a extensão
        # Ubuntu: 2 jobs de compilação. Com --parallel total, o runner de 4 CPUs/~16 GB foi
        # encerrado pelo runner ("received a shutdown signal") no meio do godot-cpp (hipótese: pico de memória).
        env:
          BUILD_JOBS: ${{ matrix.os == 'ubuntu-latest' && '2' || '4' }}
        run: cmake --build build-godot --config Release --parallel "$BUILD_JOBS"

      - name: Conferir a saída (DLL ou .so)
        shell: bash
        run: |
          ls -la sw-godot/project/addons/swarmstream/bin
          test -f sw-godot/project/addons/swarmstream/swarmstream.gdextension || \
            test -f sw-godot/project/addons/swarmstream/bin/swarmstream_godot.dll || \
            test -f sw-godot/project/addons/swarmstream/bin/swarmstream_godot.so

      # F1-17: evidência na extensão REAL (o .so que o portão carrega), não só num executável
      # equivalente. Não é migração: a extensão atual usa componentes C++ do sw-core (os mocks, via
      # gate_core.cpp) e continua assim. O sw-core passou a ligar o sw-format (libsodium, Zstd,
      # LZ4), mas o adaptador não referencia o VFS, então nenhum desses membros deve entrar no .so.
      # O QUE ISTO PROVA, e o que não: (1) os MEMBROS DE ARQUIVO (.a) que o ligador incorporou ao
      # .so (seção "Archive member included" do mapa do ld), e (2) o que o .so exige em tempo de
      # execução (readelf -d / ldd). NÃO é uma lista de símbolos do .so: o Release sai sem tabela de
      # símbolos (a primeira versão, com `nm`, falhou por isso). Cada "zero" tem um controle positivo
      # (membros que SABEMOS que entram: o adaptador gate_core, os mocks do sw-core, o godot-cpp),
      # para o zero não ser fruto de um mapa vazio ou de um padrão errado.
      - name: Membros de biblioteca incorporados e dependências do .so (evidência F1-17)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          so=sw-godot/project/addons/swarmstream/bin/swarmstream_godot.so
          map=build-godot/swarmstream_godot.map
          test -f "$so"
          test -f "$map"
          file "$so"
          echo "--- readelf -d (NEEDED)"
          readelf -d "$so" | grep NEEDED
          echo "--- ldd"
          ldd "$so"
          members="$RUNNER_TEMP/members.txt"
          awk '/^Archive member included/ { on = 1; next } /^(Discarded input sections|Memory Configuration)/ { on = 0 } on' "$map" > "$members"
          count() { RE="$1" awk '$0 ~ ENVIRON["RE"] { n++ } END { print n + 0 }' "$2"; }
          total=$(wc -l < "$members")
          core=$(count 'libsw-core\.a\(memory_cache_store\.cpp\.o\)' "$members")
          gate=$(count 'gate_core\.cpp\.o' "$members")
          godot=$(count 'godot-cpp' "$members")
          forbidden=$(count 'libsw-format|libzstd|liblz4|sodium|vfs\.cpp\.o' "$members")
          sodium_dep=$(ldd "$so" | awk '/sodium/ { n++ } END { print n + 0 }')
          libc_dep=$(ldd "$so" | awk '/libc\.so/ { n++ } END { print n + 0 }')
          echo "membros de arquivo incorporados (mapa do ld): linhas=$total  controles positivos: libsw-core(memory_cache_store)=$core gate_core=$gate godot-cpp=$godot  proibidos(libsw-format|zstd|lz4|sodium|vfs.cpp.o)=$forbidden"
          echo "dependências em tempo de execução (ldd): libsodium=$sodium_dep  controle libc.so=$libc_dep"
          if [ "$forbidden" -ne 0 ]; then
            echo "--- membros proibidos encontrados (até 20):"
            awk '/libsw-format|libzstd|liblz4|sodium|vfs\.cpp\.o/ { print "  " $0 }' "$members" | head -n 20
          fi
          test "$total" -gt 100
          test "$core" -ge 1
          test "$gate" -ge 1
          test "$godot" -ge 1
          test "$forbidden" -eq 0
          test "$libc_dep" -ge 1
          test "$sodium_dep" -eq 0

      - name: ffmpeg (gera o OGG de teste)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Godot 4.7.2 (baixado e conferido por SHA-512)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          curl -fsSL -o godot.zip             "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_LINUX_SHA512}  godot.zip" | sha512sum -c -
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"
          "./Godot_v${GODOT_VERSION}_linux.x86_64" --version

      - uses: actions/setup-python@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          python-version: "3.11"

      - name: Textura de teste (rock_path, CC0, Poly Haven, MD5 conferido)
        if: matrix.os == 'ubuntu-latest'
        run: python sw-godot/tools/download_assets.py --resolution 8k --only rock_path

      - name: Rodar o portão do F1-20 (headless)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python sw-godot/tools/gate_f1_20.py             --godot "$PWD/Godot_v${GODOT_VERSION}_linux.x86_64"             --ffmpeg ffmpeg --headless --out "$PWD/gate-out"
