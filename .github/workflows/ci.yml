name: ci

# F1-54: push só na main (nos branches roda só o pull_request); mudança só em tarefas/ ou em
# documentação não roda o CI de C++ (lista também no CLAUDE.md).
on:
  pull_request:
    paths-ignore:
      - "tarefas/**"
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "tarefas/**"
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build+test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # O port do libsodium do vcpkg compila com autotools no Linux e exige estes pacotes do sistema.
      - name: Instala as ferramentas autotools do port do libsodium (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y autoconf autoconf-archive automake libtool

      # O clone do vcpkg do runner pode não ter o commit do builtin-baseline do vcpkg.json (F1-04):
      # busca só esse commit (raso); se falhar, busca normal.
      - name: Busca o baseline do vcpkg no clone do runner
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-*) VCPKG_DIR='C:/vcpkg' ;;
            *)         VCPKG_DIR="$VCPKG_INSTALLATION_ROOT" ;;
          esac
          git -C "$VCPKG_DIR" fetch --depth=1 origin e456309491fd875487bf02b8a0dca76c1b1b00cc             || git -C "$VCPKG_DIR" fetch origin e456309491fd875487bf02b8a0dca76c1b1b00cc

      - name: Configure (vcpkg toolchain)
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-*) VCPKG_FILE='C:/vcpkg/scripts/buildsystems/vcpkg.cmake' ;;
            *)         VCPKG_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" ;;
          esac
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_FILE"

      # Licença do libsodium (F1-04, NOTICE): só informa. Compara o texto que o vcpkg instala com o
      # LICENSE do tag 1.0.22-RELEASE guardado em third_party/licenses (não falha o job).
      - name: Licença do libsodium instalada pelo vcpkg (Linux, informativo)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          f="$(ls build/vcpkg_installed/*/share/libsodium/copyright | head -n 1)"
          echo "arquivo: $f"
          cat "$f"
          if diff -u third_party/licenses/libsodium-1.0.22-LICENSE-ISC.txt "$f"; then
            echo "LICENCA IGUAL ao texto guardado no repositorio"
          else
            echo "LICENCA DIFERENTE do texto guardado (veja o diff acima)"
          fi

      - name: Build
        run: cmake --build build --config Debug --parallel

      # F1-12: um tmpfs de 16 MiB para o teste do DiskFull que vem do próprio SO (sem encher o
      # disco do runner). O teste fica PULADO onde SW_TEST_SMALL_FS não existe.
      - name: Mount small tmpfs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /mnt/sw-small
          sudo mount -t tmpfs -o size=16m,mode=1777 tmpfs /mnt/sw-small
          echo "SW_TEST_SMALL_FS=/mnt/sw-small" >> "$GITHUB_ENV"
          echo "SW_REQUIRE_SMALL_FS=1" >> "$GITHUB_ENV"

      # Prova no log que o teste do DiskFull nativo rodou (o ctest só mostra a saída de quem falha).
      - name: DiskFull nativo no tmpfs (Linux)
        if: runner.os == 'Linux'
        run: |
          out="$(build/sw-core/sw-core-store-tests)"
          echo "$out" | grep -A3 'DiskFull do próprio SO'
          if echo "$out" | grep -q 'PULADO: SW_TEST_SMALL_FS'; then exit 1; fi

      - name: Test
        shell: bash
        run: ctest --test-dir build --build-config Debug --output-on-failure --timeout 120

      # F1-54: no Windows o Release (F1-46) roda neste mesmo job, depois do Debug, para pagar uma
      # só vez o checkout e a preparação do runner. Os passos [Release] rodam mesmo se o Debug
      # falhar, e o nome do passo diz qual configuração quebrou.
      - name: "[Release] Configure (NDEBUG, vcpkg toolchain)"
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        run: |
          cmake -S . -B build-release             -DCMAKE_BUILD_TYPE=Release             -DBUILD_TESTING=ON             -DCMAKE_TOOLCHAIN_FILE='C:/vcpkg/scripts/buildsystems/vcpkg.cmake'

      - name: "[Release] Confirma que Release define NDEBUG"
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        run: grep -E 'CMAKE_CXX_FLAGS_RELEASE:STRING=.*NDEBUG' build-release/CMakeCache.txt

      - name: "[Release] Build"
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: cmake --build build-release --config Release --parallel

      - name: "[Release] Test"
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        run: ctest --test-dir build-release --build-config Release --output-on-failure --timeout 120

  # F1-46: build com NDEBUG. No Windows este teste roda dentro do job build-test (F1-54). O `assert` some nesse build; os testes usam SW_CHECK (tests/check.hpp),
  # então este job pega teste que só passaria "por não verificar nada".
  release-tests:
    name: release tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # O port do libsodium do vcpkg compila com autotools no Linux e exige estes pacotes do sistema.
      - name: Instala as ferramentas autotools do port do libsodium (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Busca o baseline do vcpkg no clone do runner
        shell: bash
        run: |
          git -C "$VCPKG_INSTALLATION_ROOT" fetch --depth=1 origin e456309491fd875487bf02b8a0dca76c1b1b00cc             || git -C "$VCPKG_INSTALLATION_ROOT" fetch origin e456309491fd875487bf02b8a0dca76c1b1b00cc

      - name: Configure (Release, vcpkg toolchain)
        shell: bash
        run: |
          VCPKG_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake -S . -B build             -DCMAKE_BUILD_TYPE=Release             -DBUILD_TESTING=ON             -DCMAKE_TOOLCHAIN_FILE="$VCPKG_FILE"

      - name: Confirma que Release define NDEBUG
        shell: bash
        run: grep -E 'CMAKE_CXX_FLAGS_RELEASE:STRING=.*NDEBUG' build/CMakeCache.txt

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: bash
        run: ctest --test-dir build --build-config Release --output-on-failure --timeout 120

  sanitizers:
    name: ASan+UBSan (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      # libsodium (F1-04, ADR-0012): estes jobs não usam o toolchain do vcpkg, então o sw-pack
      # acha o libsodium do sistema pelo pkg-config (ver sw-pack/CMakeLists.txt).
      - name: Instala libsodium (sem vcpkg)
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev pkg-config

      - name: Configure (ASan + UBSan)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DSANITIZE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test under sanitizers
        run: ctest --test-dir build --output-on-failure --timeout 120

  # F1-12: critério de aceite "sem data race no TSan com 16 threads leitoras"
  # (sw-core-owner). Roda todos os testes com -fsanitize=thread; halt_on_error derruba o teste
  # na primeira corrida reportada.
  tsan:
    name: TSan (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4

      # O kernel dos runners usa 32 bits de aleatoriedade no mmap, que o TSan não aceita
      # ("unexpected memory mapping"). 28 é o valor que o TSan suporta.
      - name: Ajusta o ASLR para o TSan
        run: sudo sysctl vm.mmap_rnd_bits=28

      # libsodium (F1-04, ADR-0012): estes jobs não usam o toolchain do vcpkg, então o sw-pack
      # acha o libsodium do sistema pelo pkg-config (ver sw-pack/CMakeLists.txt).
      - name: Instala libsodium (sem vcpkg)
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev pkg-config

      - name: Configure (TSan)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DSANITIZE_THREAD=ON

      - name: Build
        run: cmake --build build --parallel

      # O teste de queda (F1-11, rótulo `crash`) roda nos outros jobs; sob TSan é lento e não
      # traz threads novas.
      - name: Test under TSan
        run: ctest --test-dir build --output-on-failure --timeout 300 -LE crash
